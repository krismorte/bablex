name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$PR_TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9._/-]+\))?(!)?: .+' || {
            echo "PR title must follow Conventional Commits, e.g. 'feat: add search' or 'fix!: change API'."
            exit 1
          }

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests
        working-directory: backend
        run: go test ./...

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Terraform format
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"

      - name: Terraform fmt check
        working-directory: infra
        run: terraform fmt -check -recursive
      - name: Build Lambda artifact for Terraform validation
        working-directory: backend
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build \
            -tags lambda.norpc \
            -trimpath \
            -ldflags='-s -w' \
            -o ../infra/bootstrap \
            ./cmd/api

          cd ../infra
          zip -j -X lambda.zip bootstrap
          rm bootstrap

      - name: Verify Lambda artifact
        working-directory: infra
        run: |
          test -f lambda.zip
          unzip -l lambda.zip
          
      - name: Terraform init without backend
        working-directory: infra
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra
        run: terraform validate
